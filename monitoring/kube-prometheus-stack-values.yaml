alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-webhook
  config:
    route:
      receiver: "null"
      routes:
        - receiver: slack
          matchers:
            - slo = "robot-shop"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            channel: "#alerts"
            send_resolved: true
            title: '{{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }} Runbook: {{ .CommonAnnotations.runbook_url }}'